<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <style>
        body {
            text-align: center;
            background-color: #fdf6e3; /* Passt sich deinem Design an */
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        /* Dein Canva Bild Container */
        .card-container {
            max-width: 600px; /* Breite begrenzen damit es nicht riesig wird */
            margin: 0 auto;
            position: relative;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Bereich für die Buttons */
        .button-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 100px; /* Platz damit der Button springen kann */
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }

        #yesBtn {
            background-color: #4CAF50; /* Grün */
        }

        #noBtn {
            background-color: #f44336; /* Rot */
            position: absolute; /* Wichtig fürs Bewegen */
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- HIER DEIN CANVA BILD EINBINDEN -->
        <img src="hintergrund.png" alt="Valentine Card">
        
        <div class="button-container">
            <button id="yesBtn" onclick="alert('Jaaaa! Ich liebe dich! ❤️')">YES</button>
            <button id="noBtn" onmouseover="moveButton()">NO</button>
        </div>
    </div>

    <script>
        function moveButton() {
            var x = Math.random() * (window.innerWidth - 100);
            var y = Math.random() * (window.innerHeight - 100);
            var btn = document.getElementById('noBtn');
            
            // Damit der Button nicht aus dem Fenster fliegt, setzen wir ihn 'fixed' wenn er sich bewegt
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>

</body>
</html>
