<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Retoure Tisch 249,98€</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdf6e3; /* Dein Hintergrundton */
            font-family: 'Times New Roman', Times, serif; /* Passende Schriftart */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Verhindert Scrollbalken wenn Button springt */
        }

        /* Container für Yes - Bild - No */
        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px; /* Abstand zwischen Buttons und Bild */
        }

        /* Das Canva Bild */
        .card-image {
            max-width: 600px;
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Button Styling - Elegant */
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Times New Roman', serif;
            font-style: italic;
            cursor: pointer;
            background-color: transparent;
            border: 2px solid #333;
            color: #333;
            border-radius: 50px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn:hover {
            background-color: #333;
            color: #fdf6e3;
            transform: scale(1.1);
        }

        /* Spezifisch für den NO Button */
        #noBtn {
            position: relative; /* Startet normal, wird später absolut */
        }

        /* Das Pop-up Fenster (versteckt am Anfang) */
        #popup {
            display: none; /* Unsichtbar */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* Halb-transparent schwarz */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 90%;
        }

        .popup-content h1 {
            font-size: 30px;
            margin-bottom: 20px;
            color: #d63384; /* Ein schönes Pink */
        }

        .popup-content img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        /* Handy-Anpassung: Untereinander statt nebeneinander */
        @media (max-width: 800px) {
            .main-container {
                flex-direction: column;
            }
            .btn {
                margin: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- YES Button Links -->
        <button id="yesBtn" class="btn">YES</button>

        <!-- Dein Bild -->
        <img src="hintergrund.png" alt="Valentine Card" class="card-image">

        <!-- NO Button Rechts -->
        <button id="noBtn" class="btn">NO</button>
    </div>

    <!-- Das Pop-up Fenster -->
    <div id="popup">
        <div class="popup-content">
            <!-- Hier ein süßes GIF einfügen -->
            <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExcGkxaTZ3c3NhMnk4NWF0cm56ZnZnY3o4MTU4YTR0czdyM2hmMmlwcyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/YEaQWIJRg6dTa/giphy.gif" alt="Happy Gif">
            <h1>Rawrr. Freue mich dein Valentine zu sein! Love u !!! ❤️</h1>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const popup = document.getElementById('popup');

        // Funktion: Button haut ab
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed'; // Wechselt zu freier Bewegung
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // Auch beim Klicken (falls Touchscreen) soll er abhauen
        noBtn.addEventListener('click', (e) => {
            e.preventDefault(); // Verhindert Klick
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // Funktion: Pop-up anzeigen bei YES
        yesBtn.addEventListener('click', () => {
            popup.style.display = 'flex';
            // Optional: Konfetti könnte man hier auch noch zünden ;)
        });

        // Pop-up schließen wenn man daneben klickt
        popup.addEventListener('click', (e) => {
            if (e.target === popup) {
                popup.style.display = 'none';
            }
        });
    </script>

</body>
</html>
